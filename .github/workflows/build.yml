# Builds the solution and runs the tests on every push and pull request.
# Results show as a check mark or cross next to each commit on GitHub.
#
# The sample videos are not in git, so the video tests are skipped here (they run locally);
# the synthetic-eye tests run everywhere. The speed test is skipped because timing on shared
# build machines is not meaningful.
name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GitVersion needs the full history to compute the version number.

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild source/OpenIris.sln -restore -p:RestorePackagesConfig=true -p:Configuration=${{ matrix.configuration }} -p:Platform=x64 -m -nologo -v:m

      - name: Test
        run: dotnet test source/OpenIrisTests/OpenIrisTests.csproj --no-build -c ${{ matrix.configuration }} -p:Platform=x64 --logger "console;verbosity=normal"

      # When a baseline test fails, it writes the full new output next to the test assembly.
      - name: Upload output of failed baseline tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-baselines-${{ matrix.configuration }}
          path: source/OpenIrisTests/bin/${{ matrix.configuration }}/actual/
          if-no-files-found: ignore
